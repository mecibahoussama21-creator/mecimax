name: Build MeciMax APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mecimax-rebrand

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MeciMax
        uses: actions/checkout@v4

      - name: Checkout custom video player
        uses: actions/checkout@v4
        with:
          repository: BeamlakAschalew/flixquest-betterplayer
          path: flixquest-betterplayer

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Fix local package path
        run: sed -i "s|\.\./flixquest-betterplayer|flixquest-betterplayer|" pubspec.yaml

      - name: Create default environment file
        run: touch .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeciMax-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
